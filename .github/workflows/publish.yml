name: Import releases and publish Maven files

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Import one release tag, or leave empty to import all releases"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: maven-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # The import step commits and pushes new Maven files.
      pages: write # deploy-pages publishes the Maven site.
      id-token: write # deploy-pages authenticates with an OIDC token.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit step pushes imported files with the persisted checkout token.
          persist-credentials: true # zizmor: ignore[artipacked]
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun test
      - name: Import new StackAnvil releases
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          IMPORT_TAG: ${{ inputs.tag }}
        run: bun scripts/import-release.ts "$IMPORT_TAG"
      - name: Commit Maven files
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site imported-releases.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'chore(maven): import StackAnvil releases'
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'push'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'push'
        with:
          path: site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'push'
        id: deployment
