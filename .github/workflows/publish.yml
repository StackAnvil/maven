name: Import releases and publish Maven files

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      verify_tag:
        description: Release tag whose build artifact should be checked without importing it
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: maven-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Verify release build access
        if: inputs.verify_tag != ''
        env:
          GH_TOKEN: ${{ secrets.PATCHES_ARTIFACT_TOKEN || github.token }}
          VERIFY_TAG: ${{ inputs.verify_tag }}
        run: bun scripts/import-release.ts --verify-build "$VERIFY_TAG"
      - name: Import new StackAnvil releases
        if: inputs.verify_tag == ''
        env:
          GH_TOKEN: ${{ secrets.PATCHES_ARTIFACT_TOKEN || github.token }}
        run: bun scripts/import-release.ts
      - name: Commit Maven files
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site imported-releases.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'chore(maven): import StackAnvil releases'
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v6
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'push'
      - uses: actions/upload-pages-artifact@v5
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'push'
        with:
          path: site
      - uses: actions/deploy-pages@v5
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'push'
        id: deployment
